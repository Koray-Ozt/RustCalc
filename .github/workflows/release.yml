name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install GTK 3
        run: sudo apt-get update && sudo apt-get install --yes libgtk-3-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
      - name: Verify tag and project
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          test "$GITHUB_REF_NAME" = "v$version"
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
      - name: Build release artifacts
        run: bash scripts/build-release.sh dist
      - name: Verify checksums
        run: cd dist && sha256sum --check SHA256SUMS
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "RustCalc $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            --prerelease \
            dist/rust-calc_*.deb \
            dist/rust-calc-linux-x86_64 \
            dist/SHA256SUMS \
            THIRD_PARTY_NOTICES.md \
            THIRD_PARTY_LICENSES.md
